{% extends 'base.html' %}

{% block title %}Додати оголошення{% endblock %}

{% block content %}

<h1>Додати оголошення</h1>

<form method="post">

    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Заголовок</label>
        <input type="text"
               name="title"
               class="form-control"
               maxlength="200"
               required>
    </div>

    <div class="mb-3">
        <label class="form-label">Опис</label>
        <textarea name="description"
                  class="form-control"
                  rows="5"
                  required></textarea>
    </div>

    <button type="submit" class="btn btn-success">
        Опублікувати
    </button>

    <a href="{% url 'advertisement_list' %}"
       class="btn btn-secondary">
        Назад
    </a>

</form>

{% endblock %}
