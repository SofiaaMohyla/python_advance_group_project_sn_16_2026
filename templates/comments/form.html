{% extends 'base.html' %}
{% block title %}
    Створення коментаря
{% endblock title %}

{% block content %}
<h2>Створення коментаря</h2>
<form method="POST" enctype='multipart/form-data'>
    {% csrf_token %}
    {{ form.as_p }}
    {% if object %}
        <button type="submit" class="btn btn-primary">Зберегти</button>
    {% else %}
        <button type="submit" class="btn btn-primary">Створити</button>
    {% endif %}
</form>
{% endblock %}
