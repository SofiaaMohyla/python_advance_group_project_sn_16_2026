{% extends 'base.html'%}
{% block title%}
Всі Портфоліо
{% endblock title%}
{% block content %}
<h2>Список Портфоліо</h2>
<div class="d-flex align-items-end gap-2 mb-3">
    <a href="{% url 'portfolio-create' %}" class="btn btn-outline-success">
        Створити Портфоліо
    </a>

</div>
{% for portfolio in portfolios %}
    <div class="list-group mt-3">
        <a href="{% url 'portfolio-detail' portfolio.pk %}" class="list-group-item list-group-item-action">{{ portfolio.title }}
        <span class="badge rounded-pill text-bg-primary">{{ portfolio.get_status_display }}</span>
        <span class="badge rounded-pill text-bg-info">{{ portfolio.get_priority_display }}</span>
    </a>
    </div>
{% endfor %}
{% endblock %}
