{% extends "base.html" %}

{% block title %}Видалити голосування{% endblock %}

{% block content %}
<div class="card border-danger">
    <div class="card-body">
        <h1 class="h3">Видалити голосування?</h1>
        <p>«{{ object.title }}» і всі його результати буде видалено.</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Видалити</button>
            <a class="btn btn-outline-secondary" href="{% url 'voting:detail' object.pk %}">Скасувати</a>
        </form>
    </div>
</div>
{% endblock %}
