<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>матеріали</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .material-card { transition: transform 0.2s; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .material-card:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="container my-5" style="max-width: 900px;">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-dark"><i class="bi bi-folder2-open text-primary me-2"></i>матеріали групи</h1>
            <p class="text-muted">Тут зібрані всі файли</p>
        </div>

        <div class="row">
            {% for material in materials %}
                <div class="col-md-6 mb-4">
                    <div class="card h-100 material-card">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold text-dark mb-2">{{ material.title }}</h5>
                            <p class="card-text text-muted flex-grow-1">{{ material.description }}</p>
                            
                            {% if material.you_tube_link %}
                                <div class="ratio ratio-16x9 my-3">
                                    <iframe src="{{ material.you_tube_link }}" title="YouTube video" allowfullscreen></iframe>
                                </div>
                            {% endif %}

                            <div class="mt-3 pt-3 border-top">
                                {% if material.file %}
                                    <a href="{{ material.file.url }}" download class="btn btn-primary w-100 btn-sm">
                                        <i class="bi bi-download me-1"></i> Скачати файл
                                    </a>
                                {% else %}
                                    <button class="btn btn-outline-secondary w-100 btn-sm" disabled>Немає файлу</button>
                                {% endif %}
                            </div>
                        </div>
                    </div>
                </div>
            {% empty %}
                <div class="col-12 text-center text-muted py-5">
                    <i class="bi bi-inbox display-4"></i>
                    <p class="mt-2">Матеріалів немає.</p>
                </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
